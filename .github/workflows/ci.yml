name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable repository symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --frozen pytest -q
      - run: uv build --no-sources
      - name: Install wheel and verify companion assets
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/bn-wheel"
          export VIRTUAL_ENV="$RUNNER_TEMP/bn-wheel"
          uv pip install dist/*.whl
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bn="$VIRTUAL_ENV/Scripts/bn.exe"
          else
            bn="$VIRTUAL_ENV/bin/bn"
          fi
          "$bn" plugin install --mode copy --dest "$RUNNER_TEMP/bn-plugin"
          "$bn" skill install --client codex --mode copy --dest "$RUNNER_TEMP/bn-skill"
          test -f "$RUNNER_TEMP/bn-plugin/query.py"
          test -f "$RUNNER_TEMP/bn-skill/SKILL.md"
